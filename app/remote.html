<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DMX Remote">
<meta name="theme-color" content="#06080e">
<title>DMX Remote</title>
<style>
:root{--bg:#06080e;--card:#11141c;--card2:#181c26;--line:#262b38;--ink:#eef0f5;--muted:#8a90a0;--orange:#ff7a1a;--green:#2fd67b;--red:#ff4757;
  --intro:#5aa9ff;--build:#ffc531;--drop:#ff4f6d;--break:#9b7bff;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px);touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:var(--card2);border-radius:14px;cursor:pointer}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.dot.ok{background:var(--green)}
.top .t{flex:1;min-width:0}
.top b{display:block;font-size:17px}
.top small{color:var(--muted);font-family:var(--mono);font-size:12px}
.top button{padding:10px 14px;font-weight:700}
#play.on{background:var(--green);color:#04120a}
.phsel{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:12px;border-left:4px solid var(--pc,var(--green))}
.phsel span{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.phsel select,.wsel select{flex:1;font:inherit;font-weight:700;font-size:16px;color:var(--ink);background:var(--card2);border:0;border-radius:10px;padding:10px 12px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.wcard{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.wsel{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.wsel select{font-size:15px;letter-spacing:0;text-transform:none}
.wbtn{padding:20px;font-size:17px;font-weight:800;background:#123a24;color:#bff5d6}
.wbtn.on{background:var(--green);color:#04120a}
.wbtn:disabled{opacity:.4}
#wHint{color:var(--muted);font-size:12.5px;min-height:15px}
.chk{display:flex;flex-direction:column;gap:6px}
.chk div{background:var(--card);border-radius:12px;padding:10px 12px;border-left:4px solid var(--muted)}
.chk div.ok{border-color:var(--green)} .chk div.bad{border-color:var(--red)} .chk div.warn{border-color:var(--build)}
.chk b{display:block;font-size:14px} .chk small{color:var(--muted);font-size:12.5px}
.pnote{background:var(--card);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--muted);line-height:1.4}
.pnote b{color:var(--ink);display:block;font-size:16px;margin-bottom:2px}
.now{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:12px}
.nh{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.now b{display:block;font-size:18px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now small{display:block;color:var(--muted);font-size:13px;min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:16px;border-radius:6px;background:var(--card2);margin:10px 0 6px;overflow:hidden}
.segs{position:absolute;inset:0}
.segs i{position:absolute;top:0;bottom:0;opacity:.35;border-right:1px solid var(--bg)}
.segs i.past{opacity:.85}
.bar>i{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;box-shadow:0 0 6px #fff;left:0}
.nf{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.nf span:first-child{font-weight:600}
.nf span:last-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.now.off b{color:var(--muted);font-size:14px;font-weight:600}
.secs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.secs button{padding:14px 2px;font-weight:700;font-size:13px;border:2px solid transparent}
.secs button.live{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card2))}
.h{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.faders{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.fd{flex:1 0 96px;max-width:140px;background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.fd .lbl{font-size:12px;line-height:1.2;min-height:30px}
.fd .cc{font-family:var(--mono);font-size:10px;color:var(--muted)}
.track{position:relative;height:230px;border-radius:12px;background:var(--card2);overflow:hidden;touch-action:none}
.fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--orange),#ffb36b);opacity:.85}
.track.man .fill{background:linear-gradient(to top,#ff3d7f,#ff8fb5)}
.val{font-family:var(--mono);font-size:14px;text-align:center}
.val small{display:block;font-size:10px;color:var(--orange);min-height:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.tabs button{padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.tabs button.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sc{min-height:64px;padding:8px;font-size:13px;font-weight:600;text-align:left;line-height:1.15;border:2px solid transparent;word-break:break-word}
.sc.lit{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 25%,var(--card2))}
.sc.flash::after{content:"mantener";display:block;font-size:10px;font-weight:500;color:var(--muted);margin-top:3px}
.sc.pend{opacity:.45}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.bottom button{padding:16px;font-weight:700}
#panic{background:#3a0d14;color:#ffb3bd;position:relative;overflow:hidden}
#panic i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--red);opacity:.5}
.off{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);background:#3a0d14;color:#ffd0d6;padding:12px 14px;border-radius:14px;font-size:13px;display:none}
.off.show{display:block}
</style>
</head>
<body>
<div class="top">
  <span class="dot" id="dot"></span>
  <div class="t"><b id="sec">DMX Remote</b><small id="info">conectando…</small></div>
  <button id="tap">TAP</button>
  <button id="play">▶</button>
</div>
<label class="phsel" id="phBox"><span>Fase</span><select id="phase"></select></label>
<div id="v-main">
<div class="now" id="now">
  <div class="nh"><span id="nDeck">SHOWKONTROL</span><span id="nBpm"></span></div>
  <b id="nTitle">—</b>
  <small id="nArtist"></small>
  <div class="bar" id="nBar"><div class="segs" id="nSegs"></div><i id="nHead"></i></div>
  <div class="nf"><span id="nCur"></span><span id="nTime"></span></div>
</div>
<div class="secs" id="secs"></div>
<div class="h" id="fdH" hidden>Faders</div>
<div class="faders" id="faders"></div>
<div class="h">Escenas</div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="bottom">
  <button id="next">Siguiente sección ▸</button>
  <button id="panic"><i id="panicBar"></i>Apagar todo (mantener)</button>
</div>
</div>
<div id="v-warm" hidden>
  <div class="wcard" id="wCard">
    <div class="nh"><span id="wHour"></span><span id="wState"></span></div>
    <label class="wsel">Escena de Warm up<select id="wScene"></select></label>
    <button class="wbtn" id="wBtn">▶ Prender WARM UP</button>
    <small id="wHint"></small>
  </div>
  <div class="h">Escenas de la pestaña</div>
  <div class="grid" id="wGrid"></div>
</div>
<div id="v-check" hidden>
  <div class="h">Estado del sistema</div>
  <div class="chk" id="chkList"></div>
</div>
<div id="v-page" hidden>
  <div class="pnote" id="pNote"></div>
  <div class="h">Escenas de la pestaña</div>
  <div class="grid" id="pGrid"></div>
</div>
<div class="off" id="off">Sin conexión con la PC. Revisa que estés en la misma WiFi y que "Control desde el celular" siga activo.</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const K=new URLSearchParams(location.search).get('k')||'';
const api=p=>p+(p.includes('?')?'&':'?')+'k='+encodeURIComponent(K);
const COL={intro:'var(--intro)',build:'var(--build)',drop:'var(--drop)',break:'var(--break)'};
let st=null, tab=null, okAt=0, dragging={};
function cmd(m){ return fetch(api('/api/cmd'),{method:'POST',body:JSON.stringify(m),keepalive:true}).then(r=>{ if(r.ok) okAt=Date.now(); }).catch(()=>{}); }
function el(t,c,x){ const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }

// ----- estado (lo pide cada 400 ms) -----
async function poll(){
  try{ const r=await fetch(api('/api/state'),{cache:'no-store'});
    if(r.status===403){ $('info').textContent='Clave incorrecta: abre el enlace que muestra la app'; setOk(false); return; }
    const s=await r.json(); okAt=Date.now(); const first=!st||JSON.stringify(st.scenes)!==JSON.stringify(s.scenes)||JSON.stringify((st.faders||[]).map(f=>f.cc+':'+f.ch+f.label))!==JSON.stringify((s.faders||[]).map(f=>f.cc+':'+f.ch+f.label));
    st=s; if(first) build(); paint();
  }catch(e){}
  setOk(Date.now()-okAt<2500);
}
function setOk(ok){ $('dot').classList.toggle('ok',ok); $('off').classList.toggle('show',!ok&&okAt>0); }
setInterval(poll,400); poll();

// ----- armar pantalla -----
function build(){
  const secs=$('secs'); secs.innerHTML='';
  (st.secs||[]).forEach(s=>{ const b=el('button',null,s.label); b.dataset.k=s.k; b.style.setProperty('--c',COL[s.k]||'var(--orange)'); b.onclick=()=>{ cmd({t:'section',k:s.k}); }; secs.appendChild(b); });
  const fb=$('faders'); fb.innerHTML=''; $('fdH').hidden=!(st.faders||[]).length;
  (st.faders||[]).forEach(f=>fb.appendChild(fader(f)));
  const have=new Set((st.scenes||[]).map(s=>s.cat)), order=['mov','color','dim','fx','wash','laser','strobe',...Object.keys(st.cats||{})];
  const cats=[...new Set([...order.filter(c=>have.has(c)),...have])];
  if(!cats.includes(tab)) tab=cats[0]||null;
  const tb=$('tabs'); tb.innerHTML='';
  cats.forEach(c=>{ const b=el('button',c===tab?'on':null,(st.cats&&st.cats[c])||c); b.onclick=()=>{ tab=c; build(); paint(); }; tb.appendChild(b); });
  const g=$('grid'); g.innerHTML='';
  const list=mainScenes().filter(s=>s.cat===tab);
  if(!list.length) g.appendChild(el('div','empty','Importa tu proyecto de Pro DMX en la app para ver tus escenas.'));
  list.forEach(s=>g.appendChild(sceneBtn(s)));
  buildPhases(); buildView();
}
// escenas de MAIN SHOW (si el proyecto tiene esa pestaña; si no, todas)
function mainScenes(){ const all=st.scenes||[], m=all.filter(s=>/main/i.test(s.page||'')); return m.length?m:all; }
function sceneBtn(s){
  const b=el('button','sc'+(s.flash?' flash':'')+(s.pend?' pend':''),s.n.replace(/^\s*[A-Za-z]{2,3}\s*\|\s*/,'').replace(/\s*\([^)]*\)\s*$/,'')); b.dataset.n=s.n;
  const down=e=>{ e.preventDefault(); if(s.flash) b.classList.add('lit'); else b.classList.toggle('lit'); cmd({t:'scene',n:s.n,down:true}); };
  const up=e=>{ e.preventDefault(); if(s.flash){ b.classList.remove('lit'); cmd({t:'scene',n:s.n,down:false}); } };
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('contextmenu',e=>e.preventDefault());
  return b;
}
// ----- fases de la noche (menú desplegable) -----
const PAGE_RX={check:/check/i,warm:/warm/i,open:/open/i,main:/main/i,specials:/special/i,pre:/pre\s*clos|closing/i,final:/final|clos/i};
const PH_NOTE={open:'Arranque de la noche: del ambiente al primer golpe fuerte.',specials:'Cumpleaños, botellas, anuncios o una canción especial.',pre:'La recta final: la energía baja poco a poco.',final:'Cierre: salida segura y todo apagado en orden.'};
let phase='main'; try{ phase=localStorage.getItem('dmxRemoteFase')||'main'; }catch(e){}
let phKey='';
function buildPhases(){
  const ps=st.phases||[], key=ps.map(p=>p.id).join(); if(!ps.length||key===phKey) return; phKey=key;
  const s=$('phase'); s.innerHTML=''; ps.forEach(p=>s.add(new Option(p.name+' · '+p.sub,p.id)));
  if(!ps.some(p=>p.id===phase)) phase='main';
  s.value=phase;
}
$('phase').onchange=e=>{ phase=e.target.value; try{ localStorage.setItem('dmxRemoteFase',phase); }catch(_){} buildView(); paint(); window.scrollTo(0,0); };
function pageScenes(id){ const rx=PAGE_RX[id]; return rx?(st.scenes||[]).filter(s=>rx.test(s.page||'')):[]; }
function buildView(){
  const p=(st.phases||[]).find(x=>x.id===phase); $('phBox').style.setProperty('--pc',p?p.c:'var(--green)');
  const v=phase==='main'?'main':phase==='warm'?'warm':phase==='check'?'check':'page';
  ['main','warm','check','page'].forEach(x=>{ $('v-'+x).hidden=x!==v; });
  if(v==='warm'){
    const sel=$('wScene'); sel.innerHTML=''; sel.add(new Option('— elige una escena —',''));
    const ws=pageScenes('warm'), rest=(st.scenes||[]).filter(s=>!ws.includes(s));
    const og=(lbl,l)=>{ if(!l.length) return; const g=document.createElement('optgroup'); g.label=lbl; l.forEach(s=>g.appendChild(new Option(s.n,s.n))); sel.appendChild(g); };
    og('Pestaña WARM UP',ws); og('Otras escenas',rest);
    const g=$('wGrid'); g.innerHTML=''; if(!ws.length) g.appendChild(el('div','empty','Tu proyecto no tiene pestaña WARM UP.')); ws.forEach(s=>g.appendChild(sceneBtn(s)));
  }
  if(v==='page'){
    const n=$('pNote'); n.innerHTML=''; n.appendChild(el('b',null,p?p.name:'')); n.appendChild(document.createTextNode((PH_NOTE[phase]||'')+' En la PC esta pantalla aún está en desarrollo; aquí tienes las escenas de su pestaña.'));
    const g=$('pGrid'); g.innerHTML=''; const l=pageScenes(phase);
    if(!l.length) g.appendChild(el('div','empty','Esta pestaña no tiene escenas en tu proyecto.')); l.forEach(s=>g.appendChild(sceneBtn(s)));
  }
}
function paintNight(){
  const w=st.warm;
  if(phase==='warm'&&w){
    $('wHour').textContent='SUGERIDO '+w.from+' – '+w.to; $('wState').textContent=w.on?'PRENDIDO':w.open?'EN HORARIO':'FUERA DE HORARIO';
    const sel=$('wScene'); if(document.activeElement!==sel) sel.value=w.on||w.scene||''; sel.disabled=!!w.on;
    const b=$('wBtn'); b.textContent=w.on?'■ Apagar WARM UP':'▶ Prender WARM UP'; b.classList.toggle('on',!!w.on); b.disabled=!w.on&&!w.scene;
    $('wHint').textContent=w.on?w.on:!w.scene?'Primero elige la escena de Warm up.':w.open?'':'Fuera del horario sugerido. Igual lo puedes prender.';
  }
  if(phase==='check'){
    const c=$('chkList'), html=JSON.stringify(st.checks||[]); if(c.dataset.h===html) return; c.dataset.h=html; c.innerHTML='';
    (st.checks||[]).forEach(r=>{ const d=el('div',r.s); d.appendChild(el('b',null,(r.s==='ok'?'✓ ':r.s==='bad'?'✕ ':'· ')+r.t)); d.appendChild(el('small',null,r.d||'')); c.appendChild(d); });
  }
}
$('wBtn').onclick=()=>{ const w=st&&st.warm; if(!w) return; cmd({t:'warm',on:!w.on}); };
$('wScene').onchange=e=>cmd({t:'warmScene',n:e.target.value});
function fader(f){
  const k=f.ch+':'+f.cc, box=el('div','fd'); box.dataset.k=k;
  box.appendChild(el('div','lbl',f.label)); box.appendChild(el('div','cc','CC '+f.cc+' · canal '+f.ch));
  const tr=el('div','track'), fill=el('div','fill'); tr.appendChild(fill); box.appendChild(tr);
  const v=el('div','val'); box.appendChild(v);
  let last=-1, lastT=0, pend=null;
  const setFrom=e=>{ const r=tr.getBoundingClientRect(); const x=Math.max(0,Math.min(1,(r.bottom-e.clientY)/r.height)); const val=Math.round(x*127);
    show(box,val,true); if(val===last) return; last=val; const n=Date.now();
    if(n-lastT>=35){ lastT=n; cmd({t:'fader',ch:f.ch,cc:f.cc,v:val}); } else { clearTimeout(pend); pend=setTimeout(()=>{ lastT=Date.now(); cmd({t:'fader',ch:f.ch,cc:f.cc,v:last}); },35); } };
  tr.addEventListener('pointerdown',e=>{ e.preventDefault(); tr.setPointerCapture(e.pointerId); dragging[k]=true; setFrom(e); });
  tr.addEventListener('pointermove',e=>{ if(dragging[k]) setFrom(e); });
  const end=()=>{ if(!dragging[k]) return; dragging[k]=false; clearTimeout(pend); if(last>=0) cmd({t:'fader',ch:f.ch,cc:f.cc,v:last}); };
  tr.addEventListener('pointerup',end); tr.addEventListener('pointercancel',end);
  return box;
}
function show(box,val,man){
  box.querySelector('.fill').style.height=(val==null?0:val/127*100)+'%';
  box.querySelector('.track').classList.toggle('man',!!man);
  const v=box.querySelector('.val'); v.innerHTML=''; v.appendChild(document.createTextNode(val==null?'—':Math.round(val/127*100)+' %')); v.appendChild(el('small',null,man?'manual':'auto'));
}
// ----- pintar estado en vivo -----
function paint(){
  if(!st) return;
  paintSk(); paintNight(); buildPhases();
  const lbl=(st.secs||[]).find(s=>s.k===st.live);
  $('sec').textContent=lbl?lbl.label:'DMX Remote';
  $('info').textContent=(st.playing?'▶ corriendo':'■ detenido')+' · '+st.bpm+' BPM';
  $('play').textContent=st.playing?'■':'▶'; $('play').classList.toggle('on',!!st.playing);
  document.querySelectorAll('#secs button').forEach(b=>b.classList.toggle('live',b.dataset.k===st.live));
  const lit=new Set(st.lit||[]);
  document.querySelectorAll('.sc').forEach(b=>{ if(!b.matches(':active')) b.classList.toggle('lit',lit.has(b.dataset.n)); });
  (st.faders||[]).forEach(f=>{ const k=f.ch+':'+f.cc; if(dragging[k]) return; const box=document.querySelector('.fd[data-k="'+k+'"]'); if(box) show(box,f.v,f.manual); });
}
// ----- lo que suena (ShowKontrol) · la posición avanza sola entre lecturas -----
let skAt=0, segKey='';
const mmss=ms=>{ ms=Math.max(0,ms||0); const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
function paintSk(){
  const k=st&&st.sk; if(!k) return; skAt=performance.now();
  const box=$('now'); box.classList.toggle('off',!k.deck);
  if(!k.deck){ $('nDeck').textContent='SHOWKONTROL'; $('nBpm').textContent=''; $('nTitle').textContent=k.status||'—'; $('nArtist').textContent=''; $('nSegs').innerHTML=''; $('nHead').style.display='none'; $('nCur').textContent=''; $('nTime').textContent=''; return; }
  $('nDeck').textContent='DECK '+k.deck+' · '+(k.run?'SONANDO':'PAUSA'); $('nBpm').textContent=k.bpm?k.bpm+' BPM':'';
  $('nTitle').textContent=k.title||'Sin título'; $('nArtist').textContent=k.artist||'';
  const key=(k.segs||[]).map(s=>s.s+'-'+s.e+s.l).join('|')+':'+k.dur;
  if(key!==segKey){ segKey=key; const g=$('nSegs'); g.innerHTML='';
    (k.segs||[]).forEach(s=>{ const i=el('i'); i.style.left=(s.s/k.dur*100)+'%'; i.style.width=((s.e-s.s)/k.dur*100)+'%'; i.style.background=COL[s.k]||'#666'; i.dataset.e=s.e; i.title=s.l; g.appendChild(i); }); }
  $('nHead').style.display=k.dur?'':'none';
}
function tickSk(){
  const k=st&&st.sk;
  if(k&&k.deck){
    const d=k.run?performance.now()-skAt:0, pos=k.pos+d;
    if(k.dur){ $('nHead').style.left=Math.min(100,pos/k.dur*100)+'%'; document.querySelectorAll('#nSegs i').forEach(i=>i.classList.toggle('past',+i.dataset.e<=pos)); }
    const nIn=k.nextIn==null?null:Math.max(0,k.nextIn-d);
    $('nCur').textContent=(k.cur||'—')+(k.next?' → '+k.next+(nIn!=null?' en '+Math.ceil(nIn/1000)+' s':''):'');
    $('nTime').textContent=mmss(pos)+(k.dur?' / '+mmss(k.dur):'');
  }
  requestAnimationFrame(tickSk);
}
requestAnimationFrame(tickSk);
// ----- botones -----
$('play').onclick=()=>cmd({t:'play'});
$('tap').onclick=()=>cmd({t:'tap'});
$('next').onclick=()=>cmd({t:'next'});
// apagar todo: hay que mantenerlo 0.8 s (para no tocarlo por error)
let pT=null, pS=0;
const pb=$('panicBar'), pBtn=$('panic');
const pStop=()=>{ cancelAnimationFrame(pT); pT=null; pb.style.width='0'; };
pBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); pS=performance.now(); const go=()=>{ const p=(performance.now()-pS)/800; pb.style.width=Math.min(100,p*100)+'%'; if(p>=1){ pStop(); cmd({t:'panic'}); if(navigator.vibrate) navigator.vibrate(60); } else pT=requestAnimationFrame(go); }; go(); });
pBtn.addEventListener('pointerup',pStop); pBtn.addEventListener('pointercancel',pStop); pBtn.addEventListener('pointerleave',pStop);
})();
</script>
</body>
</html>
