# Publica una versión nueva: pestaña Actions → "Publicar versión" → Run workflow.
# Usa el número de "version" de package.json. Las PCs con DMX Show se actualizan solas.
name: Publicar versión

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win --publish never
      - name: Subir a Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          gh release delete "$V" --yes --cleanup-tag || true
          gh release create "$V" dist/*.exe dist/*.blockmap dist/latest.yml --title "DMX Show $V" --notes "DMX Show $V"
